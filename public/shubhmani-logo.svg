<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 110" width="540" height="110">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="25%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="75%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Luxury Emblem Icon -->
  <g transform="translate(10, 10)">
    <!-- Outer Shield / Hexagon -->
    <polygon points="45,4 82,24 82,66 45,86 8,66 8,24" fill="url(#shieldBg)" stroke="url(#goldGrad)" stroke-width="2.5" />
    <polygon points="45,10 76,27 76,63 45,80 14,63 14,27" fill="none" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1.2" stroke-dasharray="3,3" />

    <!-- Center Geometric S Monogram -->
    <path d="M57,26 C57,26 35,24 33,38 C31,50 61,46 58,60 C55,73 31,71 31,71" fill="none" stroke="url(#goldGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#goldGlow)" />
    
    <!-- Central Accent Node -->
    <circle cx="45" cy="48" r="3.5" fill="#34d399" />
    <!-- Top & Bottom Diamond Accents -->
    <polygon points="45,15 48,18 45,21 42,18" fill="url(#goldGrad)" />
    <polygon points="45,69 48,72 45,75 42,72" fill="url(#goldGrad)" />
  </g>

  <!-- Typography: SHUBHMANI -->
  <g transform="translate(115, 20)">
    <!-- Brand Name -->
    <text x="0" y="44" font-family="'Outfit', 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="4" fill="url(#goldGrad)">
      SHUBHMANI
    </text>
    
    <!-- Corporate Subtitle -->
    <text x="2" y="68" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="11.5" font-weight="700" letter-spacing="3.5" fill="#94a3b8">
      BITCOIN LIVE DESK <tspan fill="#34d399">·</tspan> MUDREX INSTITUTIONAL
    </text>
  </g>

  <!-- Live Status Beacon -->
  <g transform="translate(485, 42)">
    <circle cx="0" cy="0" r="5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="10" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.6">
      <animate attributeName="r" values="6;14;6" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
